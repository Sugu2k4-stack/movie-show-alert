name: Movie show alert

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: show-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check shows
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python show_alert.py ${{ inputs.test && '--test' || '' }}
      - name: Save state (so you are not alerted twice)
        run: |
          git config user.name "show-alert-bot"
          git config user.email "show-alert-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update show state" && git pull --rebase && git push)
